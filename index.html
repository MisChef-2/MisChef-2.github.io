<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jetliner Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
@font-face{font-family:'Korean Air Sans KR';src:url('fonts/KoreanAirSansKR_W_Rg.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
/* 레이아웃: 파일럿 포털형 셸. 70px 상단 바 + 240px 사이드 메뉴 + 24px 간격의 12칸 카드 그리드. 본문은 Korean Air Sans KR 14px(없으면 Figtree), 코드·콜사인만 고정폭.
   어두운 테마가 기본(바탕 #2d333c, 카드 #313a46), 밝은 테마는 #f2f2f7 바탕에 흰 카드. 지도 위 패널과 타일은 반투명 유리 질감. */
:root{
  color-scheme:dark;
  --bg:#2d333c; --surface:#313a46; --surface-2:#3a4452; --inset:#282e36; --line:#374151; --line-2:rgba(55,65,81,.65);
  --tile:rgba(55,65,81,.4); --tile-line:rgba(255,255,255,.1); --tile-head:linear-gradient(to right,rgba(75,85,99,.4),rgba(55,65,81,.2)); --panel:rgba(49,58,70,.86); --panel-head:rgba(99,102,241,.08);
  --fg:#f3f4f6; --fg-2:#aab8c5; --muted:#8391a2; --label:#9ca3af; --menu:#9ca3af; --menu-on:#ffffff; --top-item:#8391a2; --top-on:#bccee4;
  --primary:#3e60d5; --primary-fg:#729de8; --primary-soft:rgba(62,96,213,.22);
  --ok:#34d399; --info:#38bdf8; --warn:#fbbf24; --bad:#f87171; --indigo:#818cf8; --sky:#60a5fa; --go-a:rgba(16,185,129,.8); --go-b:rgba(5,150,105,.8);
  --boeing:#4690e8; --boeing-soft:rgba(70,144,232,.26); --airbus:#e2602c; --airbus-soft:rgba(226,96,44,.28);
  --ink:#d2dbe6; --fus:#2b323b; --wing:#465261; --eng:#5d6b7c; --glass:#74a4dc; --seat:#7d9cc4; --seat2:#a9c0dc; --cargo:#2b323b; --grid:#353e4a;
  --map-land:#465260; --scrim:rgba(17,23,31,.86); --on-photo:#ffffff; --photo-bg:#161c24; --heat1:#1d4a86; --heat2:#2563b0; --heat3:#3987e5; --heat4:#74abee; --heat5:#c2dafa;
  --shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1); --shadow-lg:0 12px 32px -10px rgba(0,0,0,.55); --tile-shadow:0 2px 8px rgba(0,0,0,.08),inset 0 1px rgba(255,255,255,.1);
  --font:'Korean Air Sans KR','Figtree','Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'SF Mono',Monaco,'Cascadia Code','Roboto Mono',Consolas,monospace;
  --wm:#ffffff; --wm-accent:#5cc6f2;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f3f4f6; --inset:#ffffff; --line:#e5e7eb; --line-2:#eef0f3;
  --tile:#f9fafb; --tile-line:#e5e7eb; --tile-head:linear-gradient(to right,rgba(243,244,246,.9),rgba(249,250,251,.5)); --panel:rgba(255,255,255,.9); --panel-head:rgba(99,102,241,.1);
  --fg:#111827; --fg-2:#6c757d; --muted:#6b7280; --label:#6b7280; --menu:#4b5563; --menu-on:#3e60d5; --top-item:#4b5563; --top-on:#3e60d5;
  --primary:#3e60d5; --primary-fg:#3e60d5; --primary-soft:rgba(62,96,213,.12);
  --ok:#059669; --info:#0d7bb0; --warn:#b45309; --bad:#dc2626; --indigo:#6366f1; --sky:#2563eb; --go-a:rgba(16,185,129,.95); --go-b:rgba(5,150,105,.95);
  --boeing:#2a78d6; --boeing-soft:rgba(42,120,214,.16); --airbus:#eb6834; --airbus-soft:rgba(235,104,52,.18);
  --ink:#24364d; --fus:#ffffff; --wing:#dde5ee; --eng:#c4d0df; --glass:#9ec1e9; --seat:#7f9dc2; --seat2:#5d7ea8; --cargo:#e9eef4; --grid:#e6eaf0;
  --map-land:#d3dae3; --scrim:rgba(17,23,31,.82); --on-photo:#ffffff; --heat1:#b7d3f6; --heat2:#86b6ef; --heat3:#3987e5; --heat4:#1c5cab; --heat5:#0d366b;
  --shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1); --shadow-lg:0 14px 34px -14px rgba(20,28,38,.3); --tile-shadow:0 2px 8px rgba(0,0,0,.06);
  --wm:#0c2c66; --wm-accent:#1690d3;
} }
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f3f4f6; --inset:#ffffff; --line:#e5e7eb; --line-2:#eef0f3;
  --tile:#f9fafb; --tile-line:#e5e7eb; --tile-head:linear-gradient(to right,rgba(243,244,246,.9),rgba(249,250,251,.5)); --panel:rgba(255,255,255,.9); --panel-head:rgba(99,102,241,.1);
  --fg:#111827; --fg-2:#6c757d; --muted:#6b7280; --label:#6b7280; --menu:#4b5563; --menu-on:#3e60d5; --top-item:#4b5563; --top-on:#3e60d5;
  --primary:#3e60d5; --primary-fg:#3e60d5; --primary-soft:rgba(62,96,213,.12);
  --ok:#059669; --info:#0d7bb0; --warn:#b45309; --bad:#dc2626; --indigo:#6366f1; --sky:#2563eb; --go-a:rgba(16,185,129,.95); --go-b:rgba(5,150,105,.95);
  --boeing:#2a78d6; --boeing-soft:rgba(42,120,214,.16); --airbus:#eb6834; --airbus-soft:rgba(235,104,52,.18);
  --ink:#24364d; --fus:#ffffff; --wing:#dde5ee; --eng:#c4d0df; --glass:#9ec1e9; --seat:#7f9dc2; --seat2:#5d7ea8; --cargo:#e9eef4; --grid:#e6eaf0;
  --map-land:#d3dae3; --scrim:rgba(17,23,31,.82); --on-photo:#ffffff; --heat1:#b7d3f6; --heat2:#86b6ef; --heat3:#3987e5; --heat4:#1c5cab; --heat5:#0d366b;
  --shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1); --shadow-lg:0 14px 34px -14px rgba(20,28,38,.3); --tile-shadow:0 2px 8px rgba(0,0,0,.06);
  --wm:#0c2c66; --wm-accent:#1690d3;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font);font-size:14px;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;color:var(--fg);font-weight:600;line-height:1.35;text-wrap:balance}
h1{font-size:18px} h2{font-size:16px} h3{font-size:14px}
p{margin:0 0 10px}
.i{flex:none}
.muted{color:var(--muted)} .small{font-size:12px}
.lbl{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label)}
.val{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:700;font-size:14px;line-height:1.4}
.mono{font-family:var(--mono);letter-spacing:.3px}
.mk-boeing{--mk:var(--boeing);--mk-soft:var(--boeing-soft)} .mk-airbus{--mk:var(--airbus);--mk-soft:var(--airbus-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mk);margin-right:6px;flex:none}
.code{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--tile);border:1px solid var(--tile-line);color:var(--fg);letter-spacing:.5px;white-space:nowrap}
.ext{color:var(--primary-fg);font-weight:500} .ext:hover{text-decoration:underline}
.empty{color:var(--muted);padding:20px 24px;margin:0}

/* 상단 바 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;height:70px;background:var(--surface);box-shadow:var(--shadow);color:var(--top-item);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9999px;border:0;background:transparent;color:var(--top-item);cursor:pointer;flex:none}
.icon-btn:hover{color:var(--top-on);background:var(--surface-2)}
.brand{display:flex;align-items:center;gap:11px;color:var(--wm);white-space:nowrap;text-decoration:none}
.brand-mark{display:block;width:34px;height:34px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.brand .bt{font-family:var(--font);font-size:15.5px;font-weight:400;letter-spacing:.17em;text-transform:uppercase;line-height:1;padding-top:1px}
.brand .bt b{font-weight:400;color:var(--wm-accent)}
.top-sp{flex:1}
.search{position:relative;flex:0 1 280px;min-width:0}
.search input{width:100%;height:38px;padding:0 58px 0 36px;border-radius:9999px;border:1px solid var(--line);background:var(--inset);color:var(--fg);font:inherit}
.search input::placeholder{color:var(--muted)}
.search > .i{position:absolute;left:12px;top:11px;color:var(--muted)}
.search kbd{position:absolute;right:12px;top:9px;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.search-pop{position:absolute;top:44px;left:0;right:0;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow-lg);padding:4px;z-index:50}
.search-pop a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;color:var(--fg)}
.search-pop a:hover,.search-pop a.sel{background:var(--surface-2)}
.clock{font-family:var(--mono);font-size:12px;color:var(--top-item);white-space:nowrap;letter-spacing:.3px}
.who{display:flex;align-items:center;gap:10px;padding-left:4px;color:var(--top-item);white-space:nowrap}
.who-t{display:grid;justify-items:end;line-height:1.25}
.who-t b{color:var(--fg);font-weight:600;font-size:13px}
.who-t small{font-size:11.5px}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:9999px;background:var(--primary-soft);color:var(--primary-fg);font-weight:700;font-size:14px;flex:none}

/* 셸 */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);align-items:start}
.side{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));height:calc(100dvh - 70px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--surface);box-shadow:var(--shadow);padding:8px 10px 24px max(10px,env(safe-area-inset-left,0px))}
body.nav-collapsed .shell{grid-template-columns:minmax(0,1fr)}
body.nav-collapsed .side{display:none}
.nav-sec{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--menu);opacity:.75;padding:14px 10px 8px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--menu);font-size:14.5px;font-weight:400;transition:color .15s}
.side a .i{width:19px;height:19px}
.side a:hover{color:var(--menu-on)}
.side a.on{color:var(--menu-on);font-weight:600}
.side a .cnt{margin-left:auto;font-size:11px;font-weight:500;padding:1px 7px;border-radius:9999px;background:var(--tile);color:var(--menu)}
.side a .livedot{width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:auto}
.backdrop{display:none}
.main{min-width:0;padding-block:24px 28px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.foot{display:flex;justify-content:space-between;gap:6px 20px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* 그리드 · 카드 */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);color:var(--fg);font-weight:600;font-size:15px}
.card-h > .i{color:var(--primary-fg)}
.card-h .sp{flex:1}
.card-h .hint{font-weight:400;font-size:12.5px;color:var(--muted)}
.card-b{padding:24px}
.stack{display:grid;gap:24px;align-content:start;min-width:0}
.sec-lbl{grid-column:span 12;margin:0 0 -12px}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;padding:18px 24px;margin-bottom:24px}
.ph.ph-mk{border-top:3px solid var(--mk)}
.ph p{margin:4px 0 0;max-width:72ch}
.ph h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph .en{font-size:13px;color:var(--muted);margin-top:2px}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.crumbs a:hover{color:var(--fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:7px 16px;border-radius:4px;border:1px solid transparent;background:var(--primary);color:var(--on-photo);font:inherit;font-weight:500;font-size:14px;line-height:1.25;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.ghost{background:rgba(107,114,128,.15);border-color:rgba(156,163,175,.3);color:var(--label);box-shadow:none}
.btn.ghost:hover{background:rgba(107,114,128,.25);filter:none}
.btn.on-dark{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:var(--on-photo);box-shadow:none}
.btn.go{background:linear-gradient(135deg,var(--go-a),var(--go-b));border-color:rgba(16,185,129,.3);color:var(--on-photo);font-weight:600;border-radius:8px;min-height:44px}
.btn.blue{background:rgba(96,165,250,.15);border-color:rgba(96,165,250,.3);color:var(--sky);box-shadow:none;border-radius:8px}
.btn.glass{background:rgba(107,114,128,.15);border-color:rgba(156,163,175,.3);color:var(--label);box-shadow:none;border-radius:8px}
.btn.warn{background:color-mix(in srgb,var(--bad) 16%,transparent);border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad);box-shadow:none}
.seg{display:inline-flex;background:var(--tile);border:1px solid var(--tile-line);border-radius:4px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:12.5px;font-weight:500;border:0;background:transparent;color:var(--fg-2);padding:4px 10px;border-radius:3px;cursor:pointer}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--primary);color:var(--on-photo)}
.seg.wide{display:flex} .seg.wide button{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:4px;white-space:nowrap;color:var(--label);background:rgba(107,114,128,.18)}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.pill.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.off{color:var(--label)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.demo{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.in,select.sel{font:inherit;font-size:14px;height:38px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--inset);color:var(--fg);width:100%;min-width:0}
textarea.in{height:auto;padding:8px 12px;resize:vertical}
.in::placeholder{color:var(--muted)}
.fld{display:grid;gap:6px;min-width:0;align-content:start}
.fld > label{font-size:13px;font-weight:500;color:var(--fg)}
.fld small{color:var(--muted);font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;align-items:start}

/* 배너 · 사진 헤더 */
.banner{position:relative;overflow:hidden;min-height:300px;display:flex;align-items:center;border-radius:6px;box-shadow:var(--shadow);background:var(--photo-bg)}
.banner > img{position:absolute;right:0;top:0;width:64%;height:100%;object-fit:cover}
.banner-in{position:relative;z-index:1;width:36%;padding:28px 30px;color:var(--on-photo)}
.banner-in .lbl{color:rgba(255,255,255,.72)}
.banner-in h1{color:var(--on-photo);font-size:26px;font-weight:600;margin:8px 0}
.banner-in p{color:rgba(255,255,255,.86);margin-bottom:16px}
.pcr{position:absolute;right:10px;top:10px;z-index:2;max-width:calc(100% - 20px);font-size:11px;line-height:1.4;color:rgba(255,255,255,.9);background:rgba(17,23,31,.55);padding:3px 8px;border-radius:4px}
.pcr a{text-decoration:underline}
.hero{position:relative;overflow:hidden;display:flex;align-items:flex-end;width:100%;aspect-ratio:21/9;min-height:300px;max-height:480px;border-radius:6px;box-shadow:var(--shadow);border-top:3px solid var(--mk);background:var(--photo-bg);margin-bottom:24px}
.hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,23,31,0) 52%,rgba(17,23,31,.9) 100%)}
.hero-in{position:relative;z-index:1;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;padding:20px 24px;color:var(--on-photo)}
.hero-in h1{color:var(--on-photo);font-size:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-in .crumbs,.hero-in .en{color:rgba(255,255,255,.78)}
.hero-in .crumbs a:hover{color:var(--on-photo)}
.hero-in .en{font-size:13px;margin-top:2px}
.hero-in p{margin:4px 0 0;color:rgba(255,255,255,.9)}
.cmp-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 24px 16px}
.cmp-photo{position:relative;display:block;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--photo-bg);border-bottom:3px solid var(--mk)}
.cmp-photo img{display:block;width:100%;height:100%;object-fit:cover}
.cmp-photo span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 7px;color:var(--on-photo);font-weight:600;font-size:13px;background:linear-gradient(transparent,rgba(17,23,31,.82))}

/* 박스 */
.box{display:flex;flex-direction:column;overflow:hidden}
.box:hover{box-shadow:0 0 0 1px var(--mk,var(--primary-fg)),var(--shadow)}
.box-img{aspect-ratio:16/9;background:var(--photo-bg);overflow:hidden}
.box-img img{display:block;width:100%;height:100%;object-fit:cover}
.box-b{padding:12px 16px 14px;display:grid;gap:4px}
.box-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box-code{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--fg);letter-spacing:.5px}
.box-name{display:flex;align-items:center;color:var(--fg);font-weight:600;font-size:13px}
.box-meta{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.3px}

/* 통계 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.stat{background:var(--surface);padding:18px 10px;display:grid;gap:2px;justify-items:center;text-align:center;align-content:start}
.stat-i{color:var(--primary-fg);height:20px}
.stat-n{font-size:20px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.stat-n small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.stat-l{font-size:12px;color:var(--muted)}
.stat-s{font-size:12px;color:var(--fg-2);font-weight:500}

/* NOTAM */
.notam{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:12px 24px;border-top:1px solid var(--line)}
.notam:first-child{border-top:0}
.notam:hover{background:var(--surface-2)}
.notam > i{border-radius:2px;background:var(--info)}
.notam.p-high > i{background:var(--bad)} .notam.p-med > i{background:var(--warn)}
.notam-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.notam-h strong{color:var(--fg);font-weight:600}
.notam .tag{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--info)}
.notam.p-high .tag{color:var(--bad)} .notam.p-med .tag{color:var(--warn)}
.notam .date{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto}
.notam p{margin:2px 0 0;font-size:13px}

/* 진행 막대 */
.prog{display:grid;gap:6px}
.prog-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--fg)}
.prog-t{height:10px;border-radius:9999px;background:var(--tile);overflow:hidden}
.prog-f{display:block;height:100%;border-radius:9999px;background:var(--mk,var(--primary))}
.prog small{color:var(--muted);font-size:12px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;margin-top:4px}
.mini div{background:var(--tile);border:1px solid var(--tile-line);border-radius:8px;padding:8px 10px;display:grid;gap:2px;box-shadow:var(--tile-shadow)}
.goal-sec{display:grid;gap:12px;padding:20px 24px}
.goal-sec + .goal-sec{border-top:1px solid var(--line)}

/* 표 */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
.tbl th{font-size:13px;color:var(--fg);font-weight:600;text-align:left;padding:12px 24px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th[data-sort]{cursor:pointer;user-select:none}
.tbl th[data-sort]:hover,.tbl th.sorted{color:var(--primary-fg)}
.tbl td{padding:11px 24px;border-top:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--tile) 55%,transparent)}
.tbl tr.row-link{cursor:pointer}
.tbl tbody tr.row-link:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td strong{color:var(--fg);font-weight:600}
.tbl .nm{display:flex;align-items:center;white-space:nowrap}
.tbl.plain{min-width:0} .tbl.plain th{white-space:normal} .tbl.plain th,.tbl.plain td{padding-left:16px;padding-right:16px}
.filters{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line)}
.filters .in{flex:1 1 200px;max-width:320px;height:36px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:24px}

/* 지도와 떠 있는 패널 */
.mapwrap{position:relative;height:430px;background:var(--inset);border-radius:6px;overflow:hidden}
.sitemap{position:absolute;inset:0 0 0 344px}
.float-panel{position:absolute;left:14px;top:14px;bottom:14px;width:316px;background:var(--panel);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--tile-line);border-radius:10px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.fp-h{padding:16px 18px;background:var(--panel-head);border-bottom:1px solid var(--tile-line)}
.fp-h h2{display:flex;align-items:center;gap:8px;font-size:18px}
.fp-h h2 .i{color:var(--primary-fg)}
.fp-h p{margin:3px 0 0;font-size:13px;color:var(--fg-2);opacity:.9}
.fp-list{overflow-y:auto;padding:10px;display:grid;gap:4px;align-content:start;grid-auto-rows:max-content}
.fp-f{padding:8px 14px;border-top:1px solid var(--tile-line);font-size:10.5px;color:var(--muted)}
.site{display:grid;gap:1px;padding:7px 9px;border-radius:8px}
.site:hover{background:var(--tile)}
.site-h{display:flex;align-items:center;color:var(--fg);font-weight:600;font-size:13px;gap:6px}
.site-h small{color:var(--muted);font-weight:400;font-size:11.5px}
.site .val{font-size:12px;color:var(--fg-2);font-weight:400}
.site.closed .site-h{color:var(--fg-2)}
.site-live{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.jvm-container{overflow:hidden;touch-action:none}
.sitemap .jvm-region{fill:var(--map-land);stroke:var(--inset);stroke-width:.5;cursor:default}
.sitemap .jvm-marker{stroke:var(--inset);stroke-width:2;cursor:pointer}
.sitemap .jvm-marker.mk-boeing{fill:var(--boeing)} .sitemap .jvm-marker.mk-airbus{fill:var(--airbus)}
.sitemap .jvm-marker.closed{fill:var(--muted)}
.jvm-tooltip{position:absolute;display:none;z-index:60;background:var(--fg);color:var(--bg);font-family:var(--font);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:4px;white-space:nowrap;pointer-events:none}
.jvm-tooltip.active{display:block}
.jvm-zoom-btn{position:absolute;right:12px;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--panel);border:1px solid var(--tile-line);color:var(--fg);cursor:pointer;font-size:16px;line-height:1;user-select:none;z-index:2}
.jvm-zoom-btn.jvm-zoomin{top:12px} .jvm-zoom-btn.jvm-zoomout{top:46px}
.mapcard.nomap .sitemap,.nomap .live-ov{display:none}
.mapcard.nomap .mapwrap{height:auto}
.nomap .float-panel{position:static;width:auto;box-shadow:none;border:0}
.livewrap{height:max(580px,calc(100dvh - 250px))}
.live-ov{position:absolute;inset:0 0 0 344px;width:calc(100% - 344px);height:100%;pointer-events:none;font-family:var(--mono)}
.livemap .jvm-region{vector-effect:non-scaling-stroke;stroke-width:.6}

/* 유리 타일: 공항 카드, 경로 카드, 수치 타일 */
.apcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.apcard{position:relative;display:grid;gap:3px;background:var(--tile);border:1px solid var(--tile-line);border-radius:10px;padding:10px 12px;box-shadow:var(--tile-shadow);min-width:0;text-align:left;font:inherit;color:inherit}
button.apcard{cursor:pointer}
.apcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.apcard .codes{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{font-size:9.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;flex:none}
.bdg.dep{color:var(--indigo)} .bdg.arr{color:var(--ok)} .bdg.cur{color:var(--warn)}
.apcard .nm{font-size:13px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apcard .tm{font-family:var(--mono);font-size:10.5px;color:var(--label);letter-spacing:.3px}
.apcard.ph0 .nm{color:var(--muted)}
.rcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard{background:var(--tile);border:1px solid var(--tile-line);border-radius:8px;overflow:hidden;box-shadow:var(--tile-shadow);min-width:0}
.rcard.wide{grid-column:span 2}
.rcard-h{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px;background:var(--tile-head);border-bottom:1px solid var(--tile-line)}
.rcard-l{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label)}
.rcard-v{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--fg);text-align:right}
.rcard-b{padding:9px 10px;font-size:14px;font-weight:700;color:var(--fg);line-height:1.4;overflow-wrap:anywhere}
.rcard-b small{font-weight:400;color:var(--muted);font-size:12px}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.leg{background:var(--tile);border:1px solid var(--tile-line);border-radius:10px;padding:10px 12px;display:grid;gap:3px;min-width:0;box-shadow:var(--tile-shadow)}
.leg .lbl{font-size:9.5px;letter-spacing:.3px}
.leg:first-child .lbl{color:var(--indigo)} .leg:last-child .lbl{color:var(--ok)}
.leg .big{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.5px;color:var(--fg)}
.leg small{color:var(--fg-2);font-size:12.5px;font-weight:500}
.pstat{padding:0 16px 16px;display:grid;gap:8px}
.pstat-h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;align-items:center}
.pbar-track{position:relative;height:6px;border-radius:9999px;background:var(--tile)}
.pbar-fill{position:absolute;top:0;bottom:0;border-radius:9999px;background:linear-gradient(to right,#60a5fa,#2563eb,#1e40af)}
.pbar-dot{position:absolute;top:-3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--fg);border:2px solid var(--surface)}
.pbar-ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.kv{background:var(--tile);border:1px solid var(--tile-line);border-radius:8px;padding:9px 11px;display:grid;gap:3px;min-width:0;align-content:start;box-shadow:var(--tile-shadow)}
.kv.wide{grid-column:span 2}
.kv .val{overflow-wrap:anywhere}
.kv .val small{font-weight:400;color:var(--muted);font-size:12px}
.kv .val.txt{font-weight:600;font-size:13.5px}

/* 실시간 운항 패널 */
.live-panel .fp-h{display:grid;gap:10px}
.live-panel .fp-h p{margin:0}
.live-panel .fp-h .code{font-size:10.5px;padding:1px 5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:4px;border:1px solid var(--tile-line);background:var(--tile);color:var(--fg-2);cursor:pointer}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:var(--on-photo)}
.live-panel .tabs button{flex:1}
.live-kvs{padding:4px 0}
.live-sec{padding:8px 2px}
.live-sec > .lbl{margin:0 0 6px}
.hchart .hbar{fill:var(--primary-fg);opacity:.75} .hchart .hbar.last{opacity:1}
.hchart g:hover .hbar{opacity:1}
.heat-leg{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.heat-leg i{display:block;width:26px;height:10px;border-radius:2px}
.heat-leg span{padding:0 4px}
.h1{background:var(--heat1);fill:var(--heat1)} .h2{background:var(--heat2);fill:var(--heat2)} .h3{background:var(--heat3);fill:var(--heat3)} .h4{background:var(--heat4);fill:var(--heat4)} .h5{background:var(--heat5);fill:var(--heat5)}
.live-ov .hc{opacity:.82}
.live-ov .ring{fill:none;stroke:var(--fg-2);stroke-width:1;opacity:.55}
.live-ov .ring.r2{stroke:var(--primary-fg);opacity:.8}
.live-ov .ringlab{fill:var(--fg-2);font-size:10.5px}
.live-ov .here circle{fill:var(--fg);stroke:var(--inset);stroke-width:2}
.live-ov .here text{fill:var(--fg);font-size:12px;font-weight:700}
.live-ov .apt{pointer-events:none}
.live-ov .apt rect{fill:var(--muted)}
.live-ov .apt text{fill:var(--muted);font-size:10.5px}
.live-ov .trail{fill:none;stroke:var(--warn);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.live-ov .plane{pointer-events:auto;cursor:pointer;--pc:var(--fg-2)}
.live-ov .plane.mk-boeing{--pc:var(--boeing)} .live-ov .plane.mk-airbus{--pc:var(--airbus)}
.live-ov .plane path{fill:var(--pc);stroke:var(--inset);stroke-width:1.2;paint-order:stroke}
.live-ov .plane .hitc{fill:transparent}
.live-ov .plane .selring{fill:none;stroke:var(--fg);stroke-width:1.5}
.live-ov .plane text{fill:var(--fg);font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--inset);stroke-width:3}
.live-ov .rt{fill:none;stroke:var(--muted);stroke-width:1;opacity:.35}
.live-ov .rt.on{stroke:var(--primary-fg);stroke-width:2.5;opacity:1;stroke-linecap:round}
.live-ov .dst{pointer-events:auto;cursor:pointer}
.live-ov .dst circle{fill:var(--fg-2);stroke:var(--inset);stroke-width:1.5}
.live-ov .dst.far circle{fill:var(--muted);opacity:.55}
.live-ov .dst.on circle{fill:var(--ok)}
.live-ov .dst .hitc{fill:transparent;stroke:none}
.live-ov .dst text{fill:var(--fg-2);font-size:10.5px;font-weight:500;paint-order:stroke;stroke:var(--inset);stroke-width:3;pointer-events:none}
.live-ov .dst.on text{fill:var(--fg);font-size:12px;font-weight:700}
.live-ctl{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 8px}
.live-err{margin:0 0 8px;padding:8px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--fg);font-size:12.5px}
.live-demo,.note{display:flex;gap:8px;margin:0 0 8px;padding:9px 11px;border-radius:8px;border:1px solid var(--tile-line);background:var(--tile);font-size:12.5px;line-height:1.5}
.live-demo .i,.note .i{color:var(--warn);margin-top:2px}
.live-demo b,.note b{color:var(--fg)}
.note.c12{margin:0;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;padding:12px 16px;font-size:13.5px}
.note.c12 > span{display:flex;gap:8px;align-items:flex-start}
.linkbtn{font:inherit;color:var(--primary-fg);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font-weight:500}
.ac-list{display:grid;gap:1px}
.ac-row{display:grid;grid-template-columns:auto 76px auto 1fr auto;align-items:center;gap:7px;width:100%;padding:8px;border:0;border-radius:8px;background:transparent;color:var(--fg-2);font:inherit;font-size:12.5px;text-align:left;cursor:pointer}
.ac-row:hover,.ac-row.on{background:var(--tile)}
.ac-row .dot{margin:0;background:var(--mk,var(--muted))}
.ac-row .cs{font-family:var(--mono);font-weight:700;color:var(--fg);letter-spacing:.3px}
.ac-row .code{font-size:10.5px;padding:1px 5px}
.ac-row .alt{font-family:var(--mono);font-size:11px;text-align:right}
.ac-row .rt{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.live-dh{grid-template-columns:1fr auto;align-items:center}
.fl-shot{position:relative;margin:0 0 6px;border-radius:8px;overflow:hidden;aspect-ratio:16/8;background:var(--photo-bg)}
.fl-shot img{display:block;width:100%;height:100%;object-fit:cover}
.fl-shot span{position:absolute;left:0;right:0;bottom:0;padding:14px 9px 5px;font-size:11px;color:var(--on-photo);background:linear-gradient(transparent,rgba(17,23,31,.8))}
.live-panel .legs{padding:0 0 8px}
.live-panel .kvs{padding:0 0 8px}
.live-panel .pstat{padding:0 0 8px}
.conn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.conn h3{margin-bottom:8px}
.keyform{display:grid;gap:6px;margin-top:16px}
.keyrow{display:flex;gap:8px;flex-wrap:wrap}
.keyrow .in,.keyrow input{flex:1 1 220px;min-width:0;height:38px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--inset);color:var(--fg);font:inherit}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.codeblk{margin:4px 0 0;padding:10px 12px;border-radius:6px;background:var(--inset);border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--fg-2);overflow-x:auto;white-space:pre}
.lv-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.lv-tile{display:grid;gap:3px;justify-items:start;padding:16px 24px;border:0;background:var(--surface);color:var(--fg-2);font:inherit;text-align:left;cursor:pointer;min-width:0}
.lv-tile:hover{background:var(--surface-2)}
.lv-top{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.lv-name{color:var(--fg);font-weight:600;font-size:13px}
.lv-n{font-size:24px;font-weight:700;color:var(--fg);line-height:1.2;font-variant-numeric:tabular-nums}
.lv-n small{font-size:12px;font-weight:500;color:var(--muted);margin-left:5px}
.spark{display:block;width:100%;max-width:150px;height:28px}
.spark rect{fill:var(--primary-fg);opacity:.8}
.lv-credit{margin:0;padding:8px 24px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--line)}
.aclive{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}

/* 파일럿 허브 */
.bk-panel .fp-list{gap:12px;padding:16px}
.bk-list{display:grid;gap:1px;max-height:none}
.bk-row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:transparent;color:var(--fg-2);font:inherit;font-size:12.5px;text-align:left;cursor:pointer}
.bk-row:hover,.bk-row.on{background:var(--tile)}
.bk-row b{font-family:var(--mono);color:var(--fg);letter-spacing:.3px}
.bk-row .km{font-family:var(--mono);font-size:11px;color:var(--muted)}
.bk-row.far{opacity:.55}
.bk-panel .apcard-top{flex-direction:column-reverse;align-items:flex-start;gap:2px}
.bk-panel .apcard .codes{font-size:15px;max-width:100%}
.bk-panel .rcard-h{flex-direction:column;align-items:flex-start;gap:3px}
.bk-panel .rcard-v{text-align:left;font-size:13px}
.flt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px}
.flt .mid{display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:12px;min-width:90px}
.flt .mid .ln{width:100%;height:2px;border-radius:2px;background:linear-gradient(to right,var(--indigo),var(--ok))}
.pbox{display:grid;gap:8px;padding:16px;min-height:132px;align-content:start}
.pbox .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pbox .rte{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--fg);letter-spacing:.5px}
.pbox .sub{font-size:12.5px;color:var(--fg-2)}
.pbox .rte.txt{font-family:inherit;letter-spacing:0}
.pbox.cta{justify-items:start}
.rank{display:grid;gap:8px}
.rank-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rank-h b{font-size:16px;color:var(--fg);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{display:grid;gap:3px;padding:12px;border-radius:8px;background:var(--tile);border:1px solid var(--tile-line);box-shadow:var(--tile-shadow)}
.badge .i{width:22px;height:22px;color:var(--warn)}
.badge b{color:var(--fg);font-weight:600;font-size:13.5px}
.badge small{font-size:12px;color:var(--muted)}
.badge.locked{opacity:.45}
.badge.locked .i{color:var(--muted)}
.tour{display:grid;gap:10px;padding:18px 24px;border-top:1px solid var(--line)}
.tour:first-child{border-top:0}
.tour-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tour-legs{display:flex;gap:8px;flex-wrap:wrap}
.tleg{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.3px;padding:4px 9px;border-radius:9999px;background:var(--tile);border:1px solid var(--tile-line);color:var(--fg-2)}
.tleg.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pts{display:grid;gap:0}
.pts div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.pts div:first-child{border-top:0}
.pts b{font-variant-numeric:tabular-nums;color:var(--fg)}
.pts .tot{border-top:1px solid var(--line);font-weight:700;color:var(--fg)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.me-row td{background:var(--primary-soft)!important}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)} .sync.err::before{background:var(--bad)}

/* 차트 */
.plot{background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:10px 6px 4px;overflow-x:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.lg{display:inline-flex;align-items:center;gap:7px}
.lg::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--mk)}
.lg b{color:var(--fg);font-weight:700}
.chart{display:block;width:100%;height:auto;font-family:var(--font)}
.chart.wide{min-width:560px}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px}
.chart .axis{fill:var(--fg-2);font-size:11.5px}
.chart .axis-line{stroke:var(--line);stroke-width:1}
.chart .pt circle{fill:var(--mk);fill-opacity:.6;stroke:var(--inset);stroke-width:2;cursor:pointer}
.chart .pt:hover circle{fill-opacity:.95}
.chart .pt text{fill:var(--fg);font-size:11.5px;font-weight:500;pointer-events:none}
.chart .bar{fill:var(--mk)}
.chart .hit{fill:transparent}
.chart g:hover > .hit{fill:var(--surface-2)}
.chart .vlab{fill:var(--fg);font-size:11px;font-weight:700}
.tl .lane{stroke:var(--mk);stroke-width:2;opacity:.55}
.tl .lanelab{fill:var(--mk);font-size:12px;font-weight:700}
.tl .ev{cursor:pointer}
.tl .ev line{stroke:var(--line);stroke-width:1}
.tl .ev circle{fill:var(--mk);stroke:var(--inset);stroke-width:2}
.tl .ev text{fill:var(--fg);font-size:11.5px;font-weight:500}
.tl .ev .yr{fill:var(--muted);font-weight:400}

/* 도면 */
.ac-svg{display:block;height:auto}
.ac-svg .fus,.ac-svg .fs-fill{fill:var(--fus)}
.ac-svg .fus,.ac-svg .wing,.ac-svg .stab,.ac-svg .fin,.ac-svg .eng,.ac-svg .pylon,.ac-svg .cock,.ac-svg .fs-line{stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ac-svg .wing,.ac-svg .stab,.ac-svg .fin,.ac-svg .pylon{fill:var(--wing)}
.ac-svg .eng{fill:var(--eng)}
.viz .ac-svg .eng{fill:var(--mk-soft)}
.ac-svg .win,.ac-svg .cock{fill:var(--glass)}
.ac-svg .cock{stroke-width:.7}
.ac-svg .det{fill:none;stroke:var(--ink);stroke-width:.8;opacity:.62;vector-effect:non-scaling-stroke}
.ac-svg .det.tip{stroke-width:2.2;opacity:.9}
.ac-svg .fair{fill:var(--wing);stroke:var(--ink);stroke-width:1.1;vector-effect:non-scaling-stroke}
.ac-svg .spin{fill:var(--inset);stroke:var(--ink);stroke-width:.8;vector-effect:non-scaling-stroke}
.sil .det,.sil .cock,.ov .det,.ov .cock{display:none}
.ac-svg .gear{stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke}
.ac-svg .tyre{fill:var(--ink)}
.ac-svg .ground{stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke}
.ac-svg .hinge{stroke:var(--mk,var(--muted));stroke-width:1.2;stroke-dasharray:.5 .35;vector-effect:non-scaling-stroke}
.ac-svg .fs-line{fill:none}
.ac-svg .floor{stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.ac-svg .seat{fill:var(--seat)} .ac-svg .seat2{fill:var(--seat2)}
.ac-svg .cargo{fill:var(--cargo);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:.3 .2}
.ac-svg .dim line{stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke}
.ac-svg .dim text{fill:var(--fg-2);font-family:var(--mono)}
.ac-svg .vlabel{fill:var(--muted);font-family:var(--font);font-weight:600;letter-spacing:.05em}
.sil{width:100%}
.ov *{vector-effect:non-scaling-stroke}
.ov .fus,.ov .wing,.ov .stab,.ov .eng{fill:var(--mk);fill-opacity:.24;stroke:var(--mk);stroke-width:1.4}
.ov .hinge{display:none}

/* 기종 상세 */
.detail{display:grid;grid-template-columns:348px minmax(0,1fr);gap:24px;align-items:start}
.viz{background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto}
.viz .tv,.viz .ov-svg{width:100%;min-width:560px;max-width:780px;margin:0 auto}
.viz .cs{width:100%;max-width:330px;margin:0 auto}
.cap{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.prose p{max-width:76ch}
.prose p:last-child{margin-bottom:0}
.feats{margin:0;padding-left:18px;display:grid;gap:5px}
.kd{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kd li{display:grid;gap:2px;background:var(--tile);border:1px solid var(--tile-line);border-left:3px solid var(--mk);border-radius:8px;padding:9px 12px;font-size:13px;box-shadow:var(--tile-shadow)}
.kd-date{font-family:var(--mono);font-weight:700;color:var(--fg);font-size:11.5px;letter-spacing:.3px}
.rival{display:flex;align-items:center;gap:12px}
.rival svg{width:120px;flex:none}
.rival strong{color:var(--fg)}
.rival:hover strong{color:var(--primary-fg)}
.ac-card{display:flex;flex-direction:column;background:var(--tile);border:1px solid var(--tile-line);border-radius:8px;overflow:hidden;box-shadow:var(--tile-shadow)}
.ac-card:hover{border-color:var(--mk)}
.ac-card-fig{aspect-ratio:16/9;overflow:hidden;background:var(--photo-bg)}
.ac-card-fig img{display:block;width:100%;height:100%;object-fit:cover}
.ac-card-body{padding:10px 12px 12px;display:grid;gap:4px}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.lu-item{display:flex;flex-direction:column;align-items:center;background:var(--tile);border:1px solid var(--tile-line);border-radius:8px;padding:6px 6px 9px;text-align:center}
.lu-item:hover{border-color:var(--mk)}
.lu-item svg{width:100%;max-width:180px}
.lu-item span{font-family:var(--mono);font-weight:700;font-size:12.5px;color:var(--fg);letter-spacing:.3px}
.lu-item small{color:var(--muted);font-size:10.5px;font-family:var(--mono)}
.lane-title{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--mk);margin:16px 0 8px}
.lane-title:first-child{margin-top:0}

/* 제작사 · 연표 */
.facts{margin:0;display:grid}
.facts div{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line-2)}
.facts div:first-child{border-top:0;padding-top:0}
.facts dd{margin:0;color:var(--fg)}
.era{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:16px 24px;border-top:1px solid var(--line)}
.era:first-child{border-top:0}
.era-y{font-family:var(--mono);font-weight:700;color:var(--mk);font-size:12.5px;letter-spacing:.3px}
.era h3{margin-bottom:4px}
.era p{margin:0;max-width:76ch}
.tl-list{list-style:none;margin:0;padding:0 0 0 6px;border-left:2px solid var(--line);display:grid;gap:9px}
.tl-list li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;position:relative;padding-left:14px}
.tl-list li::before{content:"";position:absolute;left:-7px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--mk,var(--muted));border:2px solid var(--surface)}
.tl-year{font-family:var(--mono);font-weight:700;color:var(--fg);font-size:12.5px;letter-spacing:.3px}
.tl-list strong{color:var(--fg);font-weight:600}
.tl-list p{margin:0;font-size:13px}
.tl-cols{columns:2 320px;column-gap:28px}
.tl-cols .tl-list{break-inside:avoid-column}
.decade{font-family:var(--mono);color:var(--muted);font-size:12px;margin:16px 0 8px}
.decade:first-child{margin-top:0}

/* 비교 */
.cmp-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 24px}
.cmp-pick{display:flex;align-items:center;gap:8px;flex:1 1 240px;min-width:0}
.cmp-pick .dot{width:11px;height:11px;border-radius:3px;margin:0}
.barset{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:center}
.bar-lab{font-size:13px}
.bars{display:grid;gap:3px}
.brow{display:flex;align-items:center;gap:8px;min-width:0}
.bfill{display:block;height:9px;border-radius:9999px;background:var(--mk);flex:none;max-width:calc(100% - 92px)}
.bval{font-size:12.5px;color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums}

.tip{position:fixed;z-index:70;background:var(--fg);color:var(--bg);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:4px;pointer-events:none;max-width:260px;box-shadow:var(--shadow-lg)}

/* 비행장 차트: 어두운 테마는 야간 차트, 밝은 테마는 흰 종이 차트. 버튼으로 주간·야간을 따로 고를 수 있다. */
.chart{--ch-day:0;--ch-bg:#0d141c;--ch-paper:#111a24;--ch-ink:#d3dce6;--ch-sub:#8d9db0;--ch-line:#3b4a5c;--ch-ap:#1b2632;--ch-apl:#334356;--ch-twi:#2a3846;--ch-two:#7d91a7;--ch-tl:#56697f;--ch-tm:#3f5064;--ch-tml:#677b92;--ch-rw:#e6ecf2;--ch-rcl:#0d141c;--ch-halo:#0d141c;--ch-acc:#7cc4ff;
  border:1.5px solid var(--ch-line);background:var(--ch-paper);color:var(--ch-ink);border-radius:4px;overflow:hidden;font-family:var(--font)}
.chart.day{--ch-day:1;--ch-bg:#fdfcf8;--ch-paper:#ffffff;--ch-ink:#161d26;--ch-sub:#56616e;--ch-line:#1d2530;--ch-ap:#e2e4e7;--ch-apl:#b4bac2;--ch-twi:#ffffff;--ch-two:#46515d;--ch-tl:#8a929b;--ch-tm:#a3abb4;--ch-tml:#68717b;--ch-rw:#1b2129;--ch-rcl:#ffffff;--ch-halo:#fdfcf8;--ch-acc:#0b5cad}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .chart:not(.night){--ch-day:1;--ch-bg:#fdfcf8;--ch-paper:#ffffff;--ch-ink:#161d26;--ch-sub:#56616e;--ch-line:#1d2530;--ch-ap:#e2e4e7;--ch-apl:#b4bac2;--ch-twi:#ffffff;--ch-two:#46515d;--ch-tl:#8a929b;--ch-tm:#a3abb4;--ch-tml:#68717b;--ch-rw:#1b2129;--ch-rcl:#ffffff;--ch-halo:#fdfcf8;--ch-acc:#0b5cad} }
:root[data-theme="light"] .chart:not(.night){--ch-day:1;--ch-bg:#fdfcf8;--ch-paper:#ffffff;--ch-ink:#161d26;--ch-sub:#56616e;--ch-line:#1d2530;--ch-ap:#e2e4e7;--ch-apl:#b4bac2;--ch-twi:#ffffff;--ch-two:#46515d;--ch-tl:#8a929b;--ch-tm:#a3abb4;--ch-tml:#68717b;--ch-rw:#1b2129;--ch-rcl:#ffffff;--ch-halo:#fdfcf8;--ch-acc:#0b5cad}
.ch-wrap{padding:16px 16px 12px}
.ch-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 14px;border-bottom:1.5px solid var(--ch-line)}
.ch-id b{display:block;font-family:var(--mono);font-size:21px;letter-spacing:1px;line-height:1.1}
.ch-id span{font-family:var(--mono);font-size:12px;color:var(--ch-sub);letter-spacing:1.5px}
.ch-tt{min-width:0}
.ch-tt strong{display:block;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;line-height:1.3}
.ch-tt span{display:block;font-size:12px;color:var(--ch-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-kind{text-align:right}
.ch-kind b{display:block;font-size:12.5px;font-weight:600;letter-spacing:.16em}
.ch-kind span{font-family:var(--mono);font-size:11px;color:var(--ch-sub);white-space:nowrap}
.ch-fq{display:flex;flex-wrap:wrap;border-bottom:1.5px solid var(--ch-line)}
.ch-fb{flex:1 1 auto;min-width:96px;padding:6px 12px;border-right:1px solid var(--ch-line);margin-right:-1px}
.ch-fb span{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--ch-sub)}
.ch-fb b{display:block;font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}
.ch-view{position:relative;height:560px;background:var(--ch-bg);cursor:grab;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;outline:none;overflow:hidden}
.ch-view.grab{cursor:grabbing}
.ch-view:focus-visible{box-shadow:inset 0 0 0 2px var(--ch-acc)}
.ch-map,.ch-ov{position:absolute;inset:0;width:100%;height:100%;display:block}
.ch-ov{pointer-events:none}
.c-ap{fill:var(--ch-ap);stroke:var(--ch-apl);stroke-width:1;vector-effect:non-scaling-stroke}
.c-tl{fill:none;stroke:var(--ch-tl);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.c-two{fill:none;stroke:var(--ch-two);stroke-linejoin:round;stroke-linecap:round}
.c-twi{fill:none;stroke:var(--ch-twi);stroke-width:23;stroke-linejoin:round;stroke-linecap:round}
.c-tm{fill:var(--ch-tm);stroke:var(--ch-tml);stroke-width:1;vector-effect:non-scaling-stroke}
.c-rw{fill:var(--ch-rw)}
.c-rcl{fill:none;stroke:var(--ch-rcl);stroke-width:1;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
.c-th{fill:none;stroke:var(--ch-rcl);stroke-width:1.6;vector-effect:non-scaling-stroke}
.ch-ov text{font-family:var(--font);fill:var(--ch-ink);paint-order:stroke;stroke:var(--ch-halo);stroke-width:3px;stroke-linejoin:round}
.ch-ov .o-rd{font-family:var(--mono);font-size:13px;font-weight:700}
.ch-ov .o-rl{font-family:var(--mono);font-size:10.5px}
.ch-ov .o-tw{font-size:10.5px;font-weight:700;fill:var(--ch-acc)}
.ch-ov .o-tm{font-size:9.5px;letter-spacing:.08em;fill:var(--ch-sub)}
.ch-ov .o-gr{font-family:var(--mono);font-size:9.5px;fill:var(--ch-sub)}
.o-tk{fill:none;stroke:var(--ch-ink);stroke-width:1}
.o-na path{fill:var(--ch-ink)}
.ch-ov .o-na text{font-size:12px;font-weight:700}
.o-sb rect{stroke:var(--ch-ink);stroke-width:1}
.o-sb .k{fill:var(--ch-ink)}
.o-sb .w{fill:var(--ch-bg)}
.o-ct circle{fill:var(--ch-bg);stroke:var(--ch-ink);stroke-width:1.4}
.o-ct path{stroke:var(--ch-ink);stroke-width:1.2}
.ch-tools{position:absolute;top:10px;right:10px;display:grid;gap:5px}
.ch-tools button{width:34px;height:34px;display:grid;place-items:center;border-radius:4px;border:1px solid var(--ch-line);background:var(--ch-paper);color:var(--ch-ink);cursor:pointer;padding:0}
.ch-tools button:hover{color:var(--ch-acc);border-color:var(--ch-acc)}
.ch-tools button:focus-visible{outline:2px solid var(--ch-acc);outline-offset:1px}
.ch-status{position:absolute;left:12px;bottom:28px;max-width:calc(100% - 230px);font-size:12px;line-height:1.4;padding:5px 10px;border-radius:4px;background:var(--ch-paper);color:var(--ch-ink);border:1px solid var(--ch-line);pointer-events:none}
.ch-status[hidden]{display:none}
.ch-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 14px;padding:6px 12px;border-top:1.5px solid var(--ch-line);font-size:10.5px;letter-spacing:.03em;color:var(--ch-sub)}
.ch-foot a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.ch-tip{margin:10px 2px 0}
.chart.full{position:fixed;inset:0;z-index:300;border-radius:0;border:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.chart.full .ch-view{flex:1;height:auto;touch-action:none}
body.ch-lock{overflow:hidden}
.ch-side .tbl th,.ch-side .tbl td{padding-left:16px;padding-right:16px}
.ch-side .tbl small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--font);white-space:nowrap}
.ch-side .tbl-wrap + .tbl-wrap{border-top:1px solid var(--line)}
.ch-ext{display:grid;gap:8px;border-top:1px solid var(--line)}
.ch-ext strong{font-size:13.5px;color:var(--fg)}
.ch-ext .btn{justify-content:flex-start;flex-wrap:wrap;text-align:left}
.ch-ext .btn small{font-size:11.5px;font-weight:400;color:var(--muted)}
.ch-ext p{margin:2px 0 0}
.apcard-ch{position:absolute;right:10px;bottom:8px;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--primary-fg);text-decoration:none}
.apcard-ch .i{width:13px;height:13px}
.apcard-ch:hover{text-decoration:underline}
.apcard .tm{padding-right:52px}
@media (max-width:760px){ .ch-wrap{padding:12px 10px 10px} .ch-view{height:430px} .ch-head{grid-template-columns:auto minmax(0,1fr)} .ch-kind{grid-column:1/-1;text-align:left;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline} .ch-fb{min-width:84px;padding:5px 10px} .ch-status{max-width:calc(100% - 24px);bottom:62px} }

@media (max-width:1240px){ .c8,.c7,.c6,.c5,.c4{grid-column:span 12} .c3{grid-column:span 6} .detail{grid-template-columns:minmax(0,1fr)} }
@media (max-width:1040px){ .banner{display:block;min-height:0} .banner > img{position:static;display:block;width:100%;height:auto;aspect-ratio:21/9} .banner-in{width:auto;padding:20px 24px 24px} .who-t{display:none} }
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side,body.nav-collapsed .side{display:block;position:fixed;left:0;top:calc(70px + env(safe-area-inset-top,0px));bottom:0;height:auto;width:256px;z-index:25;transform:translateX(-102%);transition:transform .18s;box-shadow:var(--shadow-lg)}
  body.nav-open .side{transform:none}
  body.nav-open .backdrop{display:block;position:fixed;inset:0;z-index:24;background:rgba(10,14,20,.5)}
  .search kbd{display:none}
  .search input{padding-right:12px}
  .mapwrap{height:auto;display:flex;flex-direction:column}
  .sitemap{position:relative;inset:auto;height:260px}
  .float-panel{position:static;width:auto;margin:10px;box-shadow:none}
  .livewrap{height:auto}
  .livewrap .livemap{height:340px}
  .live-ov{inset:0 0 auto 0;width:100%;height:340px}
}
@media (max-width:760px){
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px}
  .main{padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid,.stack,.detail{gap:16px}
  .card-h{padding:12px 16px} .card-b{padding:16px} .ph{padding:16px;margin-bottom:16px}
  .tbl th,.tbl td{padding-left:16px;padding-right:16px} .filters{padding:12px 16px} .cards{padding:16px}
  .notam,.tour,.era{padding-left:16px;padding-right:16px} .goal-sec{padding:16px}
  .lv-tile{padding:14px 16px} .cmp-controls{padding:14px 16px} .cmp-photos{padding:0 16px 14px;grid-template-columns:1fr}
  .hero{display:block;aspect-ratio:auto;min-height:0;max-height:none;background:var(--surface);margin-bottom:16px}
  .hero > img{position:static;display:block;height:auto;aspect-ratio:16/9}
  .hero::after{display:none}
  .hero-in{color:var(--fg-2);padding:14px 16px}
  .hero-in h1{color:var(--fg);font-size:20px}
  .hero-in .crumbs,.hero-in .en{color:var(--muted)}
  .hero-in p{color:var(--fg-2)}
  .hero-in .btn.on-dark{background:rgba(107,114,128,.15);border-color:rgba(156,163,175,.3);color:var(--label)}
  .conn{grid-template-columns:minmax(0,1fr)}
  .lv-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flt{grid-template-columns:1fr} .flt .mid{justify-items:start}
}
@media (max-width:560px){
  .c3{grid-column:span 12}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clock,.brand .bt{display:none}
  .era{grid-template-columns:minmax(0,1fr);gap:4px}
  .banner-in h1{font-size:21px}
}
/* ---------- 개발 배경 (왜 만들어졌나) ---------- */
.why-q{margin:0;padding:18px 24px 16px;font-size:18px;line-height:1.5;font-weight:600;color:var(--fg);border-bottom:1px solid var(--line);border-left:4px solid var(--mk);text-wrap:balance}
.why .era{grid-template-columns:112px minmax(0,1fr)}
.why .era-y{font-family:var(--font);font-size:13px;letter-spacing:0;line-height:1.45}
.why-eras .era-y{color:var(--primary-fg)}
.why-eras .era{grid-template-columns:112px minmax(0,1fr)}
a.why-chip{font-family:var(--font);font-size:12.5px;letter-spacing:0;color:var(--fg)}
a.why-chip:hover{border-color:var(--mk)}
a.why-chip .dot{margin-right:0}

/* ---------- 비행 원리 (학습 자료) ---------- */

.lr-3d{display:grid;place-items:center;min-height:340px;perspective:900px;background:linear-gradient(var(--lr-sky1),var(--lr-sky2))}

    [1, -1].forEach(sg => {
      o += `<path class="wing" d="M${N(sg * root)} ${N(wy - t)} L${N(sg * hs)} ${N(wingY(1) - 0.1)} L${N(sg * hs)} ${N(wingY(1) + 0.1)} L${N(sg * root)} ${N(wy + t)}Z"/>`;
      if (g.winglet) { const wh = g.wingletSmall ? w * 0.3 : w * 0.62; o += `<path class="wing" d="M${N(sg * (hs - 0.3))} ${N(wingY(1))} L${N(sg * (hs + 0.05))} ${N(wingY(1) - wh)} L${N(sg * (hs + 0.3))} ${N(wingY(1) - wh)} L${N(sg * (hs + 0.02))} ${N(wingY(1) + 0.1)}Z"/>`; }
      if (g.engineMount === "wing") g.enginePos.forEach(p => { const x = sg * p * hs, yc = wingY(p) + eW * 0.62; o += `<line class="gear" x1="${N(x)}" y1="${N(wingY(p))}" x2="${N(x)}" y2="${N(yc - eW * 0.45)}"/><circle class="eng" cx="${N(x)}" cy="${N(yc)}" r="${N(eW / 2)}"/><circle class="spin" cx="${N(x)}" cy="${N(yc)}" r="${N(eW * 0.33)}"/><circle class="det" cx="${N(x)}" cy="${N(yc)}" r="${N(eW * 0.09)}"/>`; });
      else o += `<circle class="eng" cx="${N(sg * (w / 2 + eW * 0.5))}" cy="${N(-h * 0.18)}" r="${N(eW / 2)}"/><circle class="spin" cx="${N(sg * (w / 2 + eW * 0.5))}" cy="${N(-h * 0.18)}" r="${N(eW * 0.33)}"/>`;
    });
    // 착륙장치 (동체 뒤쪽에서 내려오므로 동체보다 먼저 그린다)
    const tk = gs.track / 2;
    [1, -1].forEach(sg => { o += `<line class="gear" x1="${N(sg * tk)}" y1="${N(wy + t)}" x2="${N(sg * tk)}" y2="${N(ground - gs.rM)}"/><rect class="tyre" x="${N(sg * tk - 0.62)}" y="${N(ground - gs.rM * 2)}" width="0.5" height="${N(gs.rM * 2)}" rx="0.2"/><rect class="tyre" x="${N(sg * tk + 0.12)}" y="${N(ground - gs.rM * 2)}" width="0.5" height="${N(gs.rM * 2)}" rx="0.2"/>`; });
    if (gs.sets.length > 1) [1, -1].forEach(sg => { const x = sg * (tk - 2.6); o += `<line class="gear" x1="${N(x)}" y1="${N(h * 0.4)}" x2="${N(x)}" y2="${N(ground - gs.rM)}"/><rect class="tyre" x="${N(x - 0.62)}" y="${N(ground - gs.rM * 2)}" width="0.5" height="${N(gs.rM * 2)}" rx="0.2"/><rect class="tyre" x="${N(x + 0.12)}" y="${N(ground - gs.rM * 2)}" width="0.5" height="${N(gs.rM * 2)}" rx="0.2"/>`; });
    o += `<line class="gear" x1="0" y1="${N(h * 0.45)}" x2="0" y2="${N(ground - gs.rN)}"/><rect class="tyre" x="-0.46" y="${N(ground - gs.rN * 2)}" width="0.38" height="${N(gs.rN * 2)}" rx="0.16"/><rect class="tyre" x="0.08" y="${N(ground - gs.rN * 2)}" width="0.38" height="${N(gs.rN * 2)}" rx="0.16"/>`;
    // 동체
    if (g.hump === "hump") o += `<circle class="fus" cx="0" cy="${N(-h * 0.62)}" r="${N(w * 0.34)}"/>`;
    o += `<ellipse class="fus" cx="0" cy="0" rx="${N(w / 2)}" ry="${N(h / 2)}"/>`;
    const cy = g.hump === "hump" ? -h * 0.74 : g.hump === "double" ? -h * 0.13 : -h * 0.2, cw = g.hump === "hump" ? w * 0.6 : w;
    [1, -1].forEach(sg => { o += `<path class="cock" d="M${N(sg * cw * 0.3)} ${N(cy + h * 0.02)} L${N(sg * cw * 0.03)} ${N(cy - h * 0.045)} L${N(sg * cw * 0.03)} ${N(cy + h * 0.085)} L${N(sg * cw * 0.27)} ${N(cy + h * 0.12)}Z"/>`; });
    o += `<circle class="det" cx="0" cy="${N(h * 0.12)}" r="${N(w * 0.2)}"/>`;
    o += `<line class="ground" x1="${N(-hs - 2)}" y1="${N(ground)}" x2="${N(hs + 2)}" y2="${N(ground)}"/>`;
    return { svg: o, top: yTop - (g.tail === "T" ? 0.4 : 0), ground: ground };
  }

  /* ---------- 치수선 ---------- */
  const dimH = (x1, x2, y, label, s) => `<g class="dim"><line x1="${N(x1)}" y1="${N(y)}" x2="${N(x2)}" y2="${N(y)}"/><line x1="${N(x1)}" y1="${N(y - 0.9)}" x2="${N(x1)}" y2="${N(y + 0.9)}"/><line x1="${N(x2)}" y1="${N(y - 0.9)}" x2="${N(x2)}" y2="${N(y + 0.9)}"/><text x="${N((x1 + x2) / 2)}" y="${N(y - 0.7)}" text-anchor="middle" font-size="${N(12 / s)}">${esc(label)}</text></g>`;
  const dimV = (x, y1, y2, label, s) => `<g class="dim"><line x1="${N(x)}" y1="${N(y1)}" x2="${N(x)}" y2="${N(y2)}"/><line x1="${N(x - 0.9)}" y1="${N(y1)}" x2="${N(x + 0.9)}" y2="${N(y1)}"/><line x1="${N(x - 0.9)}" y1="${N(y2)}" x2="${N(x + 0.9)}" y2="${N(y2)}"/><text transform="translate(${N(x + 1.3)} ${N((y1 + y2) / 2)}) rotate(90)" text-anchor="middle" font-size="${N(12 / s)}">${esc(label)}</text></g>`;

  /* ---------- 3면도 (평면 · 측면 · 정면) ---------- */
  function threeView(ac) {
    const S = ac.specs, L = S.length, B = S.span, W = 760, X = Math.max(L, B);
    const s = (W - 20) / (X + 17), x0 = (X - L) / 2 + 2, xc = X / 2 + 2, xr = X + 8;
    const sv = sideView(ac), fv = frontView(ac);
    const topH = B + 9, sideH = (sv.ground - sv.top) + 7.5, frontH = (fv.ground - fv.top) + 6.5;
    const H = (topH + sideH + frontH) * s + 16;
    const oyTop = B / 2 + 3.5, oySide = topH + 4 - sv.top, oyFront = topH + sideH + 4 - fv.top;
    const lab = (y, t) => `<text class="vlabel" x="0" y="${N(y)}" font-size="${N(11 / s)}">${t}</text>`;
    return `<svg class="ac-svg tv" viewBox="0 0 ${W} ${N(H)}" role="img" aria-label="${esc(ac.name)} 평면도, 측면도, 정면도. 길이 ${L}m, 날개폭 ${B}m, 높이 ${S.height}m">
<g transform="translate(10 8) scale(${N(s)})">
${lab(2.2, "평면도")}<g transform="translate(${N(x0)} ${N(oyTop)})">${topView(ac)}${dimH(0, L, B / 2 + 3.6, `길이 ${L} m`, s)}${dimV(xr - x0, -B / 2, B / 2, `날개폭 ${B} m`, s)}</g>
${lab(topH + 2.4, "측면도")}<g transform="translate(${N(x0)} ${N(oySide)})">${sv.svg}${dimV(xr - x0, sv.top, sv.ground, `높이 ${S.height} m`, s)}</g>
${lab(topH + sideH + 2.4, "정면도")}<g transform="translate(${N(xc)} ${N(oyFront)})">${fv.svg}${dimH(-S.width / 2, S.width / 2, fv.ground + 2.6, `동체 폭 ${S.width} m`, s)}</g>
</g></svg>`;
  }

  /* ---------- 객실 단면도 ---------- */
  function seatRow(cfg, floorY, cabinW) {
    const groups = cfg.split("-").map(Number), n = groups.reduce((a, b) => a + b, 0), aisleW = 0.5;
    const seatW = (cabinW - (groups.length - 1) * aisleW) / n, seatH = 1.05;
    let x = -cabinW / 2, o = "";
    groups.forEach(gN => { for (let i = 0; i < gN; i++) { o += `<rect class="seat" x="${N(x + seatW * 0.09)}" y="${N(floorY - seatH)}" width="${N(seatW * 0.82)}" height="${N(seatH)}" rx="0.12"/><rect class="seat2" x="${N(x + seatW * 0.09)}" y="${N(floorY - 0.42)}" width="${N(seatW * 0.82)}" height="0.3"/>`; x += seatW; } x += aisleW; });
    return o;
  }
  function crossSection(ac) {
    const g = geo(ac), S = ac.specs, w = S.width, h = g.fuselageH || w, rx = w / 2, ry = h / 2;
    const extraTop = g.hump === "hump" ? ry * 0.55 : 0;
    const s = 200 / (w + 1.0), W = 240, H = (h + extraTop + 2.0) * s + 6;
    const widthAt = y => 2 * rx * Math.sqrt(Math.max(0, 1 - (y / ry) * (y / ry))) * 0.92;
    let o = "";
    const cfg = typeof ac.cabin === "string" ? { lower: ac.cabin } : ac.cabin;
    if (g.hump === "hump") {
      const r = rx * 0.68, c = -1.5 * ry + r, y = (c * c - r * r + ry * ry) / (2 * c), x = Math.sqrt(Math.max(0, ry * ry - y * y));
      o += `<circle class="fs-fill" cx="0" cy="${N(c)}" r="${N(r)}"/><ellipse class="fs-fill" cx="0" cy="0" rx="${N(rx)}" ry="${N(ry)}"/>`;
      o += `<path class="fs-line" d="M${N(x)} ${N(y)} A${N(ry)} ${N(ry)} 0 1 1 ${N(-x)} ${N(y)}"/><path class="fs-line" d="M${N(-x)} ${N(y)} A${N(r)} ${N(r)} 0 1 1 ${N(x)} ${N(y)}"/>`;
      const yu = c + r * 0.32, xu = Math.sqrt(Math.max(0, r * r - (r * 0.32) ** 2)) * 0.9;
      o += `<line class="floor" x1="${N(-xu)}" y1="${N(yu)}" x2="${N(xu)}" y2="${N(yu)}"/>` + seatRow(cfg.upper, yu, xu * 2 * 0.95);
      const yl = ry * 0.26; o += `<line class="floor" x1="${N(-widthAt(yl) / 2)}" y1="${N(yl)}" x2="${N(widthAt(yl) / 2)}" y2="${N(yl)}"/>` + seatRow(cfg.lower, yl, widthAt(yl));
      o += cargo(yl, w, widthAt);
    } else {
      o += `<ellipse class="fs-fill" cx="0" cy="0" rx="${N(rx)}" ry="${N(ry)}"/><ellipse class="fs-line" cx="0" cy="0" rx="${N(rx)}" ry="${N(ry)}"/>`;
      if (g.hump === "double") {
        const yu = -ry * 0.26, yl = ry * 0.36;
        o += `<line class="floor" x1="${N(-widthAt(yu) / 2)}" y1="${N(yu)}" x2="${N(widthAt(yu) / 2)}" y2="${N(yu)}"/>` + seatRow(cfg.upper, yu, widthAt(yu));
        o += `<line class="floor" x1="${N(-widthAt(yl) / 2)}" y1="${N(yl)}" x2="${N(widthAt(yl) / 2)}" y2="${N(yl)}"/>` + seatRow(cfg.lower, yl, widthAt(yl));
        o += cargo(yl, w, widthAt);
      } else {
        const yl = ac.category === "wide" ? ry * 0.22 : ry * 0.28;
        o += `<line class="floor" x1="${N(-widthAt(yl) / 2)}" y1="${N(yl)}" x2="${N(widthAt(yl) / 2)}" y2="${N(yl)}"/>` + seatRow(cfg.lower, yl, widthAt(yl));
        o += cargo(yl, w, widthAt);
      }
    }
    o += `<g class="dim"><line x1="${N(-rx)}" y1="${N(-ry - extraTop - 0.5)}" x2="${N(rx)}" y2="${N(-ry - extraTop - 0.5)}"/><text x="0" y="${N(-ry - extraTop - 0.8)}" text-anchor="middle" font-size="${N(11 / s)}">동체 폭 ${w} m</text></g>`;
    return `<svg class="ac-svg cs" viewBox="0 0 ${W} ${N(H)}" role="img" aria-label="${esc(ac.name)} 객실 단면도, 좌석 배치 ${esc(cabinLabel(ac))}"><g transform="translate(${W / 2} ${N((extraTop + ry + 1.6) * s)}) scale(${N(s)})">${o}</g></svg>`;
  }
  function cargo(floorY, w, widthAt) {
    let o = "", y0 = floorY + 0.22;
    if (w >= 5.5) { [-0.08 - 1.53, 0.08].forEach(x => { o += `<rect class="cargo" x="${N(x)}" y="${N(y0)}" width="1.53" height="1.5" rx="0.1"/>`; }); }
    else if (w >= 4.5) { [-0.08 - 1.19, 0.08].forEach(x => { o += `<rect class="cargo" x="${N(x)}" y="${N(y0)}" width="1.19" height="1.4" rx="0.1"/>`; }); }
    else { const cw = Math.min(1.8, widthAt(y0 + 0.9) * 0.9); o += `<rect class="cargo" x="${N(-cw / 2)}" y="${N(y0)}" width="${N(cw)}" height="0.85" rx="0.1"/>`; }
    return o;
  }
  const cabinLabel = ac => typeof ac.cabin === "string" ? ac.cabin : `하층 ${ac.cabin.lower}, 상층 ${ac.cabin.upper}`;

  /* ---------- 소형 실루엣 (카드·라인업) ---------- */
  function silhouette(ac, s, W, H) {
    const L = ac.specs.length;
    return `<svg class="ac-svg sil" viewBox="0 0 ${W} ${H}" aria-hidden="true"><g transform="translate(${N((W - L * s) / 2)} ${H / 2}) scale(${s})">${topView(ac)}</g></svg>`;
  }

  /* ---------- 차트: 항속거리 × 좌석 ---------- */
  const LABEL_POS = { "boeing-737": "left", "airbus-a320": "above", "airbus-a320neo": "below", "boeing-727": "left", "boeing-747": "left",
    "boeing-777": "right", "airbus-a340": "above", "airbus-a330neo": "below", "boeing-767": "above", "airbus-a310": "below", "boeing-707": "below", "airbus-a330": "left" };
  function scatterChart() {
    const W = 760, H = 440, m = { l: 56, r: 24, t: 20, b: 44 };
    const x0 = 2000, x1 = 19000, y0 = 80, y1 = 580;
    const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
    let o = "";
    for (let v = 100; v <= 500; v += 100) o += `<line class="grid" x1="${m.l}" y1="${N(Y(v))}" x2="${W - m.r}" y2="${N(Y(v))}"/><text class="tick" x="${m.l - 8}" y="${N(Y(v) + 4)}" text-anchor="end">${v}</text>`;
    for (let v = 4000; v <= 18000; v += 2000) o += `<line class="grid" x1="${N(X(v))}" y1="${m.t}" x2="${N(X(v))}" y2="${H - m.b}"/><text class="tick" x="${N(X(v))}" y="${H - m.b + 18}" text-anchor="middle">${fmt(v)}</text>`;
    o += `<text class="axis" x="${W - m.r}" y="${H - 6}" text-anchor="end">항속거리 (km)</text><text class="axis" transform="translate(14 ${m.t + 4}) rotate(90)">표준 좌석 수</text>`;
    AIRCRAFT.forEach(ac => {
      const S = ac.specs, cx = X(S.range), cy = Y(S.seats), r = 4 + Math.sqrt(S.mtow) * 0.45, pos = LABEL_POS[ac.id] || "right";
      let lx = cx + r + 4, ly = cy + 4, an = "start";
      if (pos === "left") { lx = cx - r - 4; an = "end"; } else if (pos === "above") { lx = cx; ly = cy - r - 5; an = "middle"; } else if (pos === "below") { lx = cx; ly = cy + r + 13; an = "middle"; }
      o += `<g class="pt mk-${ac.maker}" data-tip="${esc(`<b>${ac.name}</b><br>항속거리 ${fmt(S.range)} km, 표준 ${S.seats}석 (최대 ${S.seatsMax}석)<br>최대이륙중량 ${S.mtow} t`)}" data-href="#${ac.id}"><circle cx="${N(cx)}" cy="${N(cy)}" r="${N(r)}"/><text x="${N(lx)}" y="${N(ly)}" text-anchor="${an}">${esc(short(ac))}</text></g>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="기종별 항속거리와 표준 좌석 수 산점도. 원의 크기는 최대이륙중량.">${o}</svg>`;
  }

  /* ---------- 차트: 연도별 인도 ---------- */
  function deliveryChart() {
    const W = 760, H = 300, m = { l: 48, r: 16, t: 22, b: 34 }, D = SITE.deliveries;
    const gw = (W - m.l - m.r) / D.length, bw = Math.min(11, gw * 0.36), yMax = 900;
    const Y = v => H - m.b - v / yMax * (H - m.t - m.b);
    let o = "";
    for (let v = 0; v <= yMax; v += 300) o += `<line class="grid" x1="${m.l}" y1="${N(Y(v))}" x2="${W - m.r}" y2="${N(Y(v))}"/><text class="tick" x="${m.l - 8}" y="${N(Y(v) + 4)}" text-anchor="end">${v}</text>`;
    D.forEach((d, i) => {
      const gx = m.l + i * gw + gw / 2;
      o += `<g data-tip="${esc(`<b>${d[0]}년</b><br>보잉 ${fmt(d[1])}대, 에어버스 ${fmt(d[2])}대`)}"><rect class="hit" x="${N(gx - gw / 2)}" y="${m.t}" width="${N(gw)}" height="${H - m.t - m.b}"/>`;
      o += `<rect class="bar mk-boeing" x="${N(gx - bw - 1)}" y="${N(Y(d[1]))}" width="${bw}" height="${N(Y(0) - Y(d[1]))}" rx="2"/>`;
      o += `<rect class="bar mk-airbus" x="${N(gx + 1)}" y="${N(Y(d[2]))}" width="${bw}" height="${N(Y(0) - Y(d[2]))}" rx="2"/></g>`;
      if (d[0] % 5 === 0) o += `<text class="tick" x="${N(gx)}" y="${H - m.b + 16}" text-anchor="middle">${d[0]}</text>`;
    });
    const last = D[D.length - 1], gx = m.l + (D.length - 1) * gw + gw / 2;
    o += `<text class="vlab mk-boeing" x="${N(gx - bw - 1)}" y="${N(Y(last[1]) - 5)}" text-anchor="end">${last[1]}</text><text class="vlab mk-airbus" x="${N(gx + bw + 2)}" y="${N(Y(last[2]) - 5)}" text-anchor="start">${last[2]}</text>`;
    o += `<line class="axis-line" x1="${m.l}" y1="${N(Y(0))}" x2="${W - m.r}" y2="${N(Y(0))}"/>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="2000년부터 2025년까지 보잉과 에어버스의 연간 민간기 인도 대수 막대 그래프">${o}</svg>`;
  }

  /* ---------- 차트: 초도비행 연표 ---------- */
  function firstFlightTimeline() {
    const W = 760, H = 300, m = { l: 24, r: 24 }, y0 = 1952, y1 = 2026;
    const X = y => m.l + (y - y0) / (y1 - y0) * (W - m.l - m.r);
    const lanes = { boeing: 96, airbus: 214 };
    let o = "";
    for (let y = 1960; y <= 2020; y += 10) o += `<line class="grid" x1="${N(X(y))}" y1="40" x2="${N(X(y))}" y2="${H - 30}"/><text class="tick" x="${N(X(y))}" y="${H - 12}" text-anchor="middle">${y}</text>`;
    ["boeing", "airbus"].forEach(mk => {
      const ly = lanes[mk];
      o += `<line class="lane mk-${mk}" x1="${m.l}" y1="${ly}" x2="${W - m.r}" y2="${ly}"/><text class="lanelab mk-${mk}" x="${m.l}" y="${ly - 46}">${makerName(mk)}</text>`;
      const list = AIRCRAFT.filter(a => a.maker === mk).sort((a, b) => a.firstFlight.localeCompare(b.firstFlight));
      list.forEach((ac, i) => {
        const d = new Date(ac.firstFlight), yr = d.getFullYear() + d.getMonth() / 12, x = X(yr);
        const slot = i % 4, dy = [-18, 26, -34, 42][slot];
        o += `<g class="ev mk-${mk}" data-href="#${ac.id}" data-tip="${esc(`<b>${ac.name}</b><br>초도비행 ${dateKo(ac.firstFlight)}<br>취항 ${dateKo(ac.intro)}`)}"><line x1="${N(x)}" y1="${ly}" x2="${N(x)}" y2="${N(ly + dy + (dy < 0 ? 4 : -10))}"/><circle cx="${N(x)}" cy="${ly}" r="5"/><text x="${N(x)}" y="${N(ly + dy)}" text-anchor="middle">${esc(short(ac))} <tspan class="yr">${d.getFullYear()}</tspan></text></g>`;
      });
    });
    return `<svg class="chart tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="보잉과 에어버스 기종의 초도비행 연도 연표">${o}</svg>`;
  }


  /* ================= ICAO 기준 =================
     제원에서 바로 계산되는 ICAO 분류만 다룬다.
     - 비행장 기준 코드 문자: 부속서 14 (2018년 개정 뒤로는 날개폭만으로 정한다)
     - 항적 난기류 등급: Doc 4444 (최대이륙중량 기준, A380은 따로 J)
     - 구조·소방 등급: 부속서 14 제9장 (전체 길이와 동체 폭)
     - 형식 지정자: Doc 8643 */
  const ICAO_LETTER = [["A", 0, 15], ["B", 15, 24], ["C", 24, 36], ["D", 36, 52], ["E", 52, 65], ["F", 65, 80]];
  const FOLD_SPAN = { "boeing-777x": 64.85 };   // 지상에서 날개 끝을 접었을 때의 폭
  const letterRow = span => ICAO_LETTER.find(x => span < x[2]) || ["F 초과", 80, 80];
  const groundSpan = ac => FOLD_SPAN[ac.id] || ac.specs.span;
  const acLetter = ac => letterRow(groundSpan(ac))[0];
  const letterRange = r => r[1] ? `${r[1]} m 이상 ${r[2]} m 미만` : `${r[2]} m 미만`;
  const WAKE = { J: "초대형 (Super)", H: "대형 (Heavy)", M: "중형 (Medium)", L: "소형 (Light)" };
  const wakeCat = ac => ac.id === "airbus-a380" ? "J" : ac.specs.mtow >= 136 ? "H" : ac.specs.mtow > 7 ? "M" : "L";
  // [등급, 길이 상한(m), 동체 폭 상한(m)]

${spanScale([ac])}
<p class="small muted" style="margin:10px 0 0">${fold ? `비행할 때 날개폭은 ${S.span} m로 코드 F 범위지만, 지상에서는 날개 끝을 접어 ${fold} m가 되므로 코드 E 공항 시설을 그대로 씁니다. ` : ""}코드 문자는 유도로 폭과 주기장 간격, 구조소방 등급은 공항이 갖춰야 할 소방 능력, 항적 난기류 등급은 뒤따르는 항공기와의 간격을 정하는 기준입니다. ${esc(ac.variant)} 제원으로 계산했습니다.</p></div></section>`;

<div class="grid">
<section class="card c12">${cardH(ICON.info, "ICAO와 부속서")}<div class="card-b prose"><p>ICAO는 1944년 시카고 협약으로 만들어진 유엔 전문 기구입니다. 회원국이 따르는 국제 표준과 권고(SARPs)를 협약의 부속서 19개로 정하고, 세부 절차는 Doc 번호가 붙은 문서로 냅니다. 아래 분류는 부속서 14(비행장), Doc 4444(항공교통관리 절차), Doc 8643(항공기 형식 지정자), Doc 7910(지명 약어)에서 나옵니다.</p><p class="small muted">이 페이지는 이해를 돕기 위한 요약입니다. 실제 운항과 설계에는 각 문서의 최신판과 해당 국가의 규정을 써야 합니다.</p></div></section>

<section class="card c12">${cardH(ICON.ruler, "비행장 기준 코드 (부속서 14)", `<span class="hint">예: 4E, 4F</span>`)}<div class="card-b prose"><p>공항 시설을 어떤 크기의 비행기에 맞춰 지을지 정하는 기준입니다. 숫자와 문자를 붙여 쓰며, 숫자는 비행기가 이륙에 필요한 기준 활주로 길이, 문자는 날개폭으로 정합니다. 유도로 폭, 활주로와 유도로 사이 간격, 주기장 간격이 이 문자에 따라 달라집니다. 2018년 개정 전에는 주 착륙장치 바깥 폭도 문자를 정하는 기준이었습니다.</p></div>
<div class="tbl-wrap"><table class="tbl plain"><thead><tr><th>코드 숫자</th><th>기준 활주로 길이</th><th class="sp-col"></th><th>코드 문자</th><th>날개폭</th><th>이 사이트의 기종</th></tr></thead><tbody>${ICAO_LETTER.map((r, i) => `<tr><td>${i < 4 ? `<span class="code">${i + 1}</span>` : ""}</td><td>${["800 m 미만", "800 m 이상 1,200 m 미만", "1,200 m 이상 1,800 m 미만", "1,800 m 이상", "", ""][i]}</td><td class="sp-col"></td><td><span class="code">${r[0]}</span></td><td>${letterRange(r)}</td><td>${chips(byL(r[0]))}</td></tr>`).join("")}</tbody></table></div>
<div class="card-b prose" style="padding-top:12px"><p>A380은 코드 F의 한계인 80 m 안에 들어가도록 날개폭 79.75 m로 설계됐고, 777X는 날개폭이 71.75 m지만 날개 끝을 접어 지상에서는 코드 E(64.85 m)로 다닙니다. 코드 문자가 한 단계 올라가면 공항이 유도로와 게이트를 고쳐야 하기 때문에, 제작사는 이 경계를 설계 조건으로 삼습니다.</p></div></section>

<section class="card c6">${cardH(ICON.plane, "항적 난기류 등급 (Doc 4444)")}<div class="card-b prose"><p>큰 비행기 뒤에는 날개 끝에서 생기는 강한 소용돌이가 남습니다. 관제사는 앞선 기체의 등급에 따라 뒤따르는 기체와의 간격을 넓힙니다. 등급은 최대이륙중량으로 정하고, 비행계획서에 한 글자로 적습니다.</p></div>
<div class="tbl-wrap"><table class="tbl plain"><thead><tr><th>등급</th><th>기준</th><th>이 사이트의 기종</th></tr></thead><tbody>${[["J", "A380-800 (형식 지정자 문서에서 따로 지정)"], ["H", "136 t 이상"], ["M", "7 t 초과 136 t 미만"], ["L", "7 t 이하"]].map(r => `<tr><td><span class="code">${r[0]}</span> ${WAKE[r[0]].split(" ")[0]}</td><td>${r[1]}</td><td>${chips(byW(r[0]))}</td></tr>`).join("")}</tbody></table></div>
<div class="card-b"><p class="small muted" style="margin:0">보잉 757은 중량으로는 M이지만 항적이 강해, 미국 등 일부 국가는 뒤따르는 기체에 대형기와 같은 간격을 적용합니다.</p></div></section>

<section class="card c12">${cardH(ICON.doc, "코드 읽는 법: ICAO와 IATA")}<div class="card-b prose"><p><b>기종.</b> ICAO 형식 지정자(Doc 8643)는 최대 네 글자로, 비행계획서와 관제 화면에 쓰입니다. 같은 계열이라도 형식마다 다릅니다. 예를 들어 보잉 747-400은 <span class="code">B744</span>, 747-8은 <span class="code">B748</span>, A320neo는 <span class="code">A20N</span>입니다. 항공권과 시간표에는 IATA의 세 글자 코드(744, 74H, 32N)가 쓰입니다.</p><p><b>공항.</b> ICAO 지명 약어(Doc 7910)는 네 글자입니다. 첫 글자는 지역, 둘째 글자는 대체로 국가를 뜻하고 나머지가 공항입니다. 인천은 <span class="code">RKSI</span>로, R(동아시아 일부) + K(대한민국) + SI입니다. 승객이 보는 세 글자 코드 <span class="code">ICN</span>은 IATA 코드입니다. 미국 본토는 K 뒤에 IATA 코드를 그대로 붙입니다${kUS.length ? ` (${kUS.slice(0, 3).map(a => `<a class="ext" href="#apt-${a[0]}">${a[1]}</a>`).join(", ")} 등 ${kUS.length}곳)` : ""}.</p></div>
<div class="tbl-wrap"><table class="tbl plain"><thead><tr><th>앞 두 글자</th><th>지역</th><th>이 사이트의 공항</th></tr></thead><tbody>${preRows}</tbody></table></div></section>

<section class="card c12">${cardH(ICON.route, "쌍발기 장거리 운항: ETOPS와 EDTO (부속서 6)")}<div class="card-b prose"><p>엔진이 두 개인 비행기는 엔진 하나가 꺼졌을 때 갈 수 있는 비상 공항에서 일정 시간 이상 떨어진 항로를 날 수 없습니다. 기본은 60분이고, 기종과 항공사가 따로 승인을 받으면 120분, 180분, 그 이상으로 늘어납니다. 이 승인을 오랫동안 ETOPS라 불렀고, ICAO는 2012년부터 엔진 수와 상관없이 적용하는 EDTO(회항 시간 연장 운항)라는 이름을 씁니다.</p><p>이 규정이 여객기의 역사를 바꿨습니다. 1985년 767이 120분 승인으로 대서양을 건너기 시작했고, 777은 취항 때부터 180분 승인을 받았습니다. 쌍발기가 바다를 자유롭게 건너게 되자 3발기와 4발기는 설 자리를 잃었습니다. <a class="ext" href="#timeline">시대별 개발 배경</a>에서 흐름을 볼 수 있습니다.</p></div></section>

  const artLabel = (ac, x, y, u, anchor) => `<text class="t-title" x="${N(x)}" y="${N(y)}" font-size="${N(2 * u)}"${anchor ? ` text-anchor="${anchor}"` : ""}><tspan class="t-code mk-${ac.maker}">${ICAO[ac.id]}</tspan> ${esc(ac.name)}<tspan class="t-mute" font-size="${N(1.35 * u)}" font-weight="400"> ${esc(ac.variant)}</tspan></text>`;

      const line = L => { let d = "", pen = false, prev = null; L.forEach(p => { const q = P(p[0], p[1]); if (!q || (prev && Math.abs(q.x - prev.x) > W * 0.5)) { pen = false; prev = q; return; } d += (pen ? "L" : "M") + N(q.x) + " " + N(q.y); pen = true; prev = q; }); return d; };
      const d1 = line(r.done), d2 = line(r.left); if (d1) o += `<path class="rte${on ? " on" : ""}" d="${d1}"/>`; if (d2) o += `<path class="rte rem${on ? " on" : ""}" style="stroke-dashoffset:${N(-(performance.now() / 70) % 14)}" d="${d2}"/>`;

  /* ---------- 도면 그리기와 조작 ---------- */
  let chRO = null, chExit = null;

  function initChart(code) {

    const rw = M.r.map(r => { const ax = r[5], ay = r[6], bx = r[7], by = r[8], L = Math.hypot(bx - ax, by - ay) || 1; return { le: r[0], he: r[1], ax, ay, bx, by, L, ux: (bx - ax) / L, uy: (by - ay) / L, w: (r[3] || 148) * .3048, lenM: Math.round(r[2] * .3048), widM: r[3] ? Math.round(r[3] * .3048) : null, ad: (r[13] || 0) * .3048, bd: (r[14] || 0) * .3048 }; });
    let B;
    { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; rw.forEach(r => { x0 = Math.min(x0, r.ax, r.bx); y0 = Math.min(y0, r.ay, r.by); x1 = Math.max(x1, r.ax, r.bx); y1 = Math.max(y1, r.ay, r.by); }); B = rw.length ? [x0 - 400, y0 - 400, x1 + 400, y1 + 400] : [-1500, -1500, 1500, 1500]; }

    let touched = false, raf = 0, two = null;

    function build() {

  /* ================= 화면 움직임 =================
